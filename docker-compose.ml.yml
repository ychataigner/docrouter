# Surcouche « IA réelle » : API avec la sonde CLIP (PyTorch) au lieu du tri simulé.
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml up --build -d
# L'image porte un tag distinct (docrouter-api:ml) : l'image légère reste disponible.
# La tête de classification (14 Ko) est produite par `uv run docrouter-evaluate --model probe-clip`
# dans models/probes/ ; le réseau CLIP est téléchargé depuis le Hub dans le volume hf-cache.
services:
  api:
    build:
      args:
        WITH_ML: "true"
    image: docrouter-api:ml
    environment:
      DOCROUTER_CLASSIFIER: ${DOCROUTER_CLASSIFIER:-probe}
      DOCROUTER_PROBE_HEAD: /app/models/probes/probe-clip.npz
    volumes:
      - ./models/probes:/app/models/probes:ro
