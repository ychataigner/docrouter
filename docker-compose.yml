services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        # vide = image légère, tri simulé (dev du front) ; onnx = modèle optimisé ; ml = PyTorch
        ML_EXTRA: ${ML_EXTRA:-}
    image: docrouter-api:latest
    env_file:
      - path: .env
        required: false
    # DOCROUTER_API_KEYS (clés autorisées, une par client) vient de .env, jamais versionné.
    environment:
      DOCROUTER_CLASSIFIER: ${DOCROUTER_CLASSIFIER:-dummy}
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      # Cache des modèles Hugging Face : téléchargés une seule fois.
      - hf-cache:/models
    # Itération 6 : le conteneur ne peut rien écrire, hormis le cache des modèles et un /tmp
    # en mémoire. Un document reçu ne peut donc pas être conservé sur le serveur.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    image: docrouter-ui:latest
    environment:
      DOCROUTER_API_URL: http://api:8000
      DOCROUTER_API_KEY: ${DOCROUTER_API_KEY:-}  # clé du front, lue dans .env
      TZ: Europe/Paris
    ports:
      - "8501:8501"
    volumes:
      # Les documents rangés arrivent dans ./output sur la machine hôte.
      - ./output:/data/output
    depends_on:
      - api
    restart: unless-stopped
    develop:
      # `docker compose watch` : le code du front est recopié à chaud, sans rebuild.
      watch:
        - action: sync
          path: ./services/ui/src/docrouter_ui
          target: /app/.venv/lib/python3.11/site-packages/docrouter_ui
        - action: rebuild
          path: ./services/ui/pyproject.toml

  # Suivi des expériences (évaluations, comparaisons de modèles, entraînements) : http://localhost:5000
  # Les runs sont envoyés par HTTP ; base SQLite et artefacts restent dans le volume `mlflow-data`.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts localhost:*,127.0.0.1:*,mlflow:*
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  hf-cache:
  mlflow-data:
