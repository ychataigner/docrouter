[project]
name = "docrouter-training"
version = "0.1.0"
description = "Données, entraînement et évaluation des modèles DocRouter (hors images Docker)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docrouter-core",
    "faker>=30",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.scripts]
docrouter-generate = "docrouter_training.data.generate:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
