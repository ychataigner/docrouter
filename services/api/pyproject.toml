[project]
name = "docrouter-api"
version = "0.1.0"
description = "API FastAPI de classification de documents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docrouter-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
# Tri par IA en production : modèle exporté en ONNX, exécuté par onnxruntime (sans PyTorch).
onnx = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "huggingface-hub>=0.26",  # modèles hébergés sur le Hub (hf://…)
]
# Tri par IA avec PyTorch (modèle « lourd » de référence, sonde CLIP ou DiT).
ml = [
    "transformers>=4.46",
    "torch>=2.5",
    "numpy>=1.26",
]

[tool.uv.sources]
docrouter-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
